name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # Validates the migration chain (snapshot id/prevId links). No DB
      # connection: the dummy URL only has to parse.
      - run: pnpm db:check
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci

      # Drift guard: generate must be a no-op. A schema change with no
      # migration, or a hand-written migration whose snapshot was not
      # regenerated, both show up here as an uncommitted file.
      - name: Migrations are in sync with the schema
        timeout-minutes: 2
        run: |
          pnpm db:generate < /dev/null
          if [ -n "$(git status --porcelain server/db/drizzle)" ]; then
            echo "::error::db:generate produced changes — commit the migration it wrote."
            git status --short server/db/drizzle
            exit 1
          fi
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci

      # build first: tsconfig includes .next/types, generated by the build
      - run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci

      - run: pnpm exec tsc --noEmit
